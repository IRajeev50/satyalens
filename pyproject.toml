[project]
name = "satyalens"
version = "0.1.0"
description = "Evidence-first verification workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.4",
  "python-multipart==0.0.20",
  "pillow==11.3.0",
  "pytesseract==0.3.13",
  "langdetect==1.0.9",
  "Unidecode==1.4.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
