services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: satyalens
      POSTGRES_PASSWORD: satyalens
      POSTGRES_DB: satyalens
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satyalens"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: ["satyalens_pg:/var/lib/postgresql/data"]
volumes:
  satyalens_pg:
