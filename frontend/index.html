<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SatyaLens</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="eyebrow">EVIDENCE WORKBENCH</span><h1>SatyaLens</h1><p>Inspect the evidence. Keep the uncertainty.</p></header><div id="banner" class="banner" role="status" hidden></div><section class="panel"><label>Paste a claim or article text<textarea id="text" placeholder="Paste text to verify..."></textarea></label><div class="or">or</div><label>Article URL<input id="url" type="url" placeholder="https://..."></label><div class="or">or upload a screenshot</div><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="go">Build evidence case</button><p id="error" role="alert"></p></section><section id="result" hidden><div class="card"><div class="top"><span id="verdict" class="verdict"></span><span id="confidence"></span></div><p id="rationale"></p><p class="review">Draft assessment - pending human review</p></div><h2>Atomic claims and evidence</h2><div id="claims"></div><details><summary>Reasoning path</summary><ol id="path"></ol></details><div id="warnings"></div></section></main><script src="/app.js"></script></body></html>
